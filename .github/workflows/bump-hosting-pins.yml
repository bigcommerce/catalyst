name: Bump Hosting Pins

on:
  schedule:
    # Mondays at 09:00 UTC, alongside the weekly Dependabot run.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-hosting-pins:
    name: Bump hosting pins
    runs-on: ubuntu-latest
    # One rolling branch, so a run that overlaps another can't race it.
    concurrency:
      group: ${{ github.workflow }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: canary

      - uses: pnpm/action-setup@v3

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # `semver` is needed to read the adapter's Wrangler peer range.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both pins move together or not at all: the adapter declares which
      # Wrangler it supports, so bumping either in isolation is how they drift.
      - name: Bump the hosting pins
        id: bump
        run: node .github/scripts/bump-hosting-pins.mts

      # The adapter pin reaches an installed tree only through the peer range the
      # script just rewrote, so resolve it before anything asserts against it.
      - name: Resolve the new adapter
        if: steps.bump.outputs.updated == 'true'
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      # `core` reads the Cloudflare context off a symbol key that is an internal
      # detail of the adapter; a release that changed it would leave every
      # native-hosted store silently on an in-process cache. This spec calls the
      # real implementation, so running it here is what makes the bump safe — and
      # it is the only place it gets checked, since GitHub won't run checks on a
      # PR this job pushes.
      - name: Verify the Cloudflare context contract
        if: steps.bump.outputs.updated == 'true'
        run: pnpm vitest run src/cli/lib/cloudflare-context-symbol.spec.ts
        working-directory: packages/catalyst

      - name: Open or update the pull request
        if: steps.bump.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/bump-hosting-pins
          TITLE: ${{ steps.bump.outputs.title }}
          SUMMARY: ${{ steps.bump.outputs.summary }}
          ADAPTER_VERSION: ${{ steps.bump.outputs.adapter-version }}
          WRANGLER_VERSION: ${{ steps.bump.outputs.wrangler-version }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The branch is always rebuilt from the canary tip, so the diff stays a
          # single commit and a superseded bump's changeset never lingers on it.
          git switch -c "$BRANCH"
          git add packages/catalyst/src/cli/lib/commerce-hosting.ts \
            packages/catalyst/src/cli/commands/build.ts \
            packages/catalyst/package.json pnpm-lock.yaml .changeset
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"

          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "$SUMMARY" \
            "Opened by the weekly [Bump Hosting Pins](.github/workflows/bump-hosting-pins.yml) job. Both versions are string literals in the CLI source rather than manifest entries, so Dependabot can't reach either. They are maintained in one PR because \`@opennextjs/cloudflare\` declares which Wrangler it supports — Wrangler is pinned to the newest release that adapter allows, not the newest that exists." \
            "This PR leaves the adapter at \`$ADAPTER_VERSION\` and Wrangler at \`$WRANGLER_VERSION\`. The job ran \`cloudflare-context-symbol.spec.ts\` against them before opening it, so the symbol key core depends on is known good. A release that moved the adapter's Next.js requirement, or that needs a Wrangler major this job doesn't track, holds both pins and reports why instead." \
            "GitHub doesn't run workflows on pushes made with \`GITHUB_TOKEN\`, so this PR opens without checks. Push an empty commit to run them.")

          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$TITLE" --body "$body"
            echo "Updated PR #$number."
          else
            gh pr create --base canary --head "$BRANCH" --title "$TITLE" --body "$body"
          fi
