name: Native Hosting

on:
  push:
    branches: [canary]

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors `cleanupCloudflareIncompatibilities` in the CLI: the default
      # instrumentation.ts registers @vercel/otel, which crashes workerd on cold start.
      - name: Remove Cloudflare-incompatible instrumentation
        working-directory: core
        run: |
          rm -f instrumentation.ts
          pnpm remove @vercel/otel

      # Keep the adapter version in sync with OPENNEXT_CLOUDFLARE_VERSION in
      # packages/catalyst/src/cli/lib/commerce-hosting.ts
      - name: Install OpenNext adapter
        run: pnpm add @opennextjs/cloudflare@1.20.15
        working-directory: core

      - name: Build monorepo packages
        run: pnpm --filter "./packages/*" build

      - name: Generate GraphQL types
        run: pnpm run generate
        working-directory: core
        env:
          BIGCOMMERCE_STORE_HASH: ${{ vars.NATIVE_HOSTING_BIGCOMMERCE_STORE_HASH }}
          BIGCOMMERCE_STOREFRONT_TOKEN: ${{ secrets.NATIVE_HOSTING_BIGCOMMERCE_STOREFRONT_TOKEN }}
          BIGCOMMERCE_CHANNEL_ID: ${{ vars.NATIVE_HOSTING_BIGCOMMERCE_CHANNEL_ID }}

      # The CLI built from this commit, so its project checks match this core.
      - name: Build
        run: node ../packages/catalyst/dist/cli.js build
        working-directory: core
        env:
          # CLI env vars
          CATALYST_PROJECT_UUID: ${{ secrets.NATIVE_HOSTING_BIGCOMMERCE_PROJECT_UUID }}
          # App env vars (needed by Next.js build for GraphQL calls in next.config.ts)
          BIGCOMMERCE_STORE_HASH: ${{ vars.NATIVE_HOSTING_BIGCOMMERCE_STORE_HASH }}
          BIGCOMMERCE_STOREFRONT_TOKEN: ${{ secrets.NATIVE_HOSTING_BIGCOMMERCE_STOREFRONT_TOKEN }}
          BIGCOMMERCE_CHANNEL_ID: ${{ vars.NATIVE_HOSTING_BIGCOMMERCE_CHANNEL_ID }}
          AUTH_SECRET: ${{ secrets.NATIVE_HOSTING_AUTH_SECRET }}

      - name: Deploy
        run: |
          node ../packages/catalyst/dist/cli.js deploy --prebuilt \
            --secret BIGCOMMERCE_STORE_HASH=${{ vars.NATIVE_HOSTING_BIGCOMMERCE_STORE_HASH }} \
            --secret BIGCOMMERCE_STOREFRONT_TOKEN=${{ secrets.NATIVE_HOSTING_BIGCOMMERCE_STOREFRONT_TOKEN }} \
            --secret BIGCOMMERCE_CHANNEL_ID=${{ vars.NATIVE_HOSTING_BIGCOMMERCE_CHANNEL_ID }} \
            --secret AUTH_SECRET=${{ secrets.NATIVE_HOSTING_AUTH_SECRET }} \
            2>&1 | tee "$RUNNER_TEMP/deploy.log"
        working-directory: core
        env:
          CATALYST_STORE_HASH: ${{ vars.NATIVE_HOSTING_BIGCOMMERCE_STORE_HASH }}
          CATALYST_ACCESS_TOKEN: ${{ secrets.NATIVE_HOSTING_BIGCOMMERCE_ACCESS_TOKEN }}
          CATALYST_PROJECT_UUID: ${{ secrets.NATIVE_HOSTING_BIGCOMMERCE_PROJECT_UUID }}

      - name: Verify deployment responds with 200
        run: |
          url=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/deploy.log" \
            | grep -oE 'View your deployment at: https://[^[:space:]]+' | tail -n1 | sed 's/.*: //')

          if [ -z "$url" ]; then
            echo "::error::Could not find the deployed URL in the deploy output"
            exit 1
          fi

          echo "Checking $url"

          status=000
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -L -w '%{http_code}' --max-time 30 "$url" || true)
            echo "Attempt $attempt: HTTP $status"
            [ "$status" = "200" ] && exit 0
            sleep 10
          done

          echo "::error::Expected HTTP 200 from $url but got $status"
          exit 1
