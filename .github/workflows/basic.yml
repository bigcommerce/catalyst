name: Basic

on:
  push:
    branches: [canary, integrations/makeswift, integrations/b2b-makeswift]
  pull_request:
    types: [opened, synchronize]
  merge_group:
    types: [checks_requested]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  BIGCOMMERCE_STORE_HASH: ${{ vars.BIGCOMMERCE_STORE_HASH }}
  BIGCOMMERCE_CHANNEL_ID: ${{ vars.BIGCOMMERCE_CHANNEL_ID }}
  BIGCOMMERCE_CLIENT_ID: ${{ secrets.BIGCOMMERCE_CLIENT_ID }}
  BIGCOMMERCE_CLIENT_SECRET: ${{ secrets.BIGCOMMERCE_CLIENT_SECRET }}
  BIGCOMMERCE_STOREFRONT_TOKEN: ${{ secrets.BIGCOMMERCE_STOREFRONT_TOKEN }}
  BIGCOMMERCE_ACCESS_TOKEN: ${{ secrets.BIGCOMMERCE_ACCESS_TOKEN }}
  TEST_CUSTOMER_ID: ${{ vars.TEST_CUSTOMER_ID }}
  TEST_CUSTOMER_EMAIL: ${{ vars.TEST_CUSTOMER_EMAIL }}
  TEST_CUSTOMER_PASSWORD: ${{ secrets.TEST_CUSTOMER_PASSWORD }}
  TESTS_FALLBACK_LOCALE: ${{ vars.TESTS_FALLBACK_LOCALE }}
  TESTS_READ_ONLY: ${{ vars.TESTS_READ_ONLY }}
  DEFAULT_PRODUCT_ID: ${{ vars.DEFAULT_PRODUCT_ID }}
  DEFAULT_COMPLEX_PRODUCT_ID: ${{ vars.DEFAULT_COMPLEX_PRODUCT_ID }}

jobs:
  lint-typecheck:
    name: Lint, Typecheck, and gql.tada

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v3

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gql Tada
        run: pnpm run -r generate

      - name: Lint
        run: pnpm run lint -- --max-warnings=0

      - name: Typecheck
        run: pnpm run typecheck

  cli-tests:
    name: CLI Tests

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v3

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TEMP: profile git on Windows, where the upgrade specs are ~15x slower. Remove before merge.
      # Set via system config, since turbo's strict env mode strips GIT_* env vars from tests.
      # A directory target gives each git process its own file.
      - name: Configure git tracing
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/git-trace2"
          git config --system trace2.eventTarget "$RUNNER_TEMP/git-trace2"
          git config --show-origin --get-regexp '^core\.' || true

      # TEMP experiment: git add/write-tree/commit average ~5s each here vs 0.3s on macOS,
      # consistent with fsync cost on every loose object write.
      - name: Disable git fsync
        if: runner.os == 'Windows'
        run: git config --system core.fsync none

      - name: Show Defender and temp dir state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-MpComputerStatus | Format-List AMRunningMode, RealTimeProtectionEnabled, OnAccessProtectionEnabled, BehaviorMonitorEnabled
          Get-MpPreference | Format-List DisableRealtimeMonitoring, ExclusionPath, ExclusionProcess
          "TEMP=$env:TEMP  long=$((Get-Item $env:TEMP).FullName)  RUNNER_TEMP=$env:RUNNER_TEMP"

      # TEMP experiment: put the specs' temp dirs on the D: work drive under a long path.
      - name: Run Tests
        run: pnpm run test
        env:
          TEMP: ${{ runner.os == 'Windows' && runner.temp || '' }}
          TMP: ${{ runner.os == 'Windows' && runner.temp || '' }}

      - name: Summarize git trace
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const lines = fs.readdirSync(process.argv[1])
              .flatMap((f) => fs.readFileSync(path.join(process.argv[1], f), "utf8").split("\n"))
              .filter(Boolean);
            const argv = new Map();
            const roots = new Map();
            const byCmd = new Map();
            let total = 0;
            for (const line of lines) {
              const e = JSON.parse(line);
              if (e.event === "start") argv.set(e.sid, e.argv.slice(1).find((a) => !a.startsWith("-") && !a.includes("=")) ?? "?");
              if (e.event === "def_repo" && e.worktree) {
                const root = e.worktree.split(/[\\/]/).slice(0, 3).join("/");
                roots.set(root, (roots.get(root) ?? 0) + 1);
              }
              if (e.event === "exit" && argv.has(e.sid)) {
                const cmd = argv.get(e.sid);
                const s = byCmd.get(cmd) ?? { n: 0, t: 0, max: 0 };
                s.n++; s.t += e.t_abs; s.max = Math.max(s.max, e.t_abs);
                byCmd.set(cmd, s);
                total += e.t_abs;
              }
            }
            console.log("worktree roots:", Object.fromEntries(roots));
            console.log(`git processes: ${[...byCmd.values()].reduce((a, s) => a + s.n, 0)}, total in-process time: ${total.toFixed(1)}s`);
            console.table([...byCmd].sort((a, b) => b[1].t - a[1].t).slice(0, 25)
              .map(([cmd, s]) => ({ cmd, n: s.n, total_s: +s.t.toFixed(1), avg_s: +(s.t / s.n).toFixed(3), max_s: +s.max.toFixed(2) })));
          ' "$RUNNER_TEMP/git-trace2"
