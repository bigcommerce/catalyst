version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # Owned by the Bump Hosting Pins job, which moves this in lockstep with
      # OPENNEXT_CLOUDFLARE_VERSION. A Dependabot bump would desync the two and
      # fail the Cloudflare context contract test every week.
      - dependency-name: '@opennextjs/cloudflare'
      # Disabling tailwind due to browser compatibility constraints.
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
